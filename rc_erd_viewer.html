<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RC ERD Viewer — RC_model</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 1rem; background:#121212; color:#eee }
    .container { max-width: 1200px; margin: 0 auto; }
    .mermaid { background: #0b0b0b; padding: 1rem; border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
    footer { margin-top: 1rem; color: #888; font-size: 0.9rem }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>RC ERD Viewer — RC_model</h1>
      <p>Diagram source: <code>RC_model.mmd</code></p>
    </header>

    <div id="diagram" class="mermaid">Loading diagram…</div>

    <footer>
      <p>Uses Mermaid CDN to render. For an offline image, use <code>@mermaid-js/mermaid-cli</code> and render <code>RC_model.mmd</code>.</p>
    </footer>
  </div>

  <script src="https://unpkg.com/mermaid@10.4.0/dist/mermaid.min.js"></script>
  <script>
    // initialize mermaid but don't auto-render so we can inject external source
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    async function loadAndRenderMMD(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error('Failed to fetch ' + path + ': ' + res.status);
        const text = await res.text();
        const container = document.getElementById('diagram');
        // place the mermaid source inside container and let mermaid parse it
        container.textContent = text;
        // render
        await mermaid.init(undefined, container);
      } catch (err) {
        const container = document.getElementById('diagram');
        container.textContent = 'Error loading diagram: ' + err.message;
        console.error(err);
      }
    }

    loadAndRenderMMD('RC_model.mmd');
  </script>
</body>
</html>
  }
